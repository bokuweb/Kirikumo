[package]
name = "kirikumo"
version = "0.0.0"
edition = "2024"
description = "A native Kubernetes viewer, built to stand alone and to be embedded in Ginka"
publish = false

[workspace]
members = [
    "crates/kirikumo-kube",
    "crates/kirikumo-ui",
    "crates/kirikumo-views",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
kirikumo-kube = { path = "crates/kirikumo-kube" }
kirikumo-ui = { path = "crates/kirikumo-ui" }
kirikumo-views = { path = "crates/kirikumo-views" }

# GPUI arrives transitively through gpui-component: the component library owns
# the rev, and pinning it independently guarantees a conflict on the next
# toolkit upgrade. The lock file pins both to the revs Ginka and e1 are built
# against, which is what lets `kirikumo-views` be mounted in Ginka's window
# (docs/roadmap.md §4.3): two revs of `gpui` are two unrelated sets of types.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
# `tree-sitter-yaml` is the one language feature switched on: the YAML tab is
# the toolkit's editor, and a manifest with its keys and values told apart is
# a manifest a person can read. Features are additive across the family, so
# this costs Ginka nothing until it mounts these views, and then only YAML.
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = ["tree-sitter-yaml"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

anyhow = "1"
# A channel a blocking watch thread can push into and a GPUI task can await:
# the same shape Ginka's agent drivers use for their readers.
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# The matcher for the resource filter: small, pure Rust, the one Helix and Zed
# use, and the one Ginka and e1 already match paths with.
nucleo-matcher = "0.3"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A kubeconfig is YAML, so a parser is not optional. `serde_norway` is the
# maintained fork of the unmaintained `serde_yaml`; the API is the same.
serde_norway = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The WebSocket a port-forward is, opened with the synchronous client over a
# socket of ours, because an upgrade is not a request `ureq` can make. The
# same crate Ginka links for Slack, at the same version.
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# `rustls` directly, for the one configuration `ureq` does not build for us:
# the WebSocket's. `ring` named explicitly, because `ureq` uses `ring` and two
# providers in one binary is what `rustls` refuses to guess between.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# Blocking HTTPS over rustls, run on GPUI's background executor, with the
# client certificates and private roots a kubeconfig hands us. Chosen over an
# async client because every async client on crates.io brings tokio, and Ginka
# runs on smol: a second reactor in the embedding process is the one thing the
# host forbids (its AGENTS.md § Conventions).
ureq = { version = "3", features = ["json"] }

[dependencies]
kirikumo-kube.workspace = true
kirikumo-ui.workspace = true
kirikumo-views.workspace = true
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
rust-i18n.workspace = true
tracing.workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[lints]
workspace = true
